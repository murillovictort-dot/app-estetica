<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agendamento Premium</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>Agende seu horário</h1>
    <p class="subtitle">Atendimento estético com elegância</p>

    <form method="POST">
        <input type="text" name="nome" placeholder="Seu nome" required>
        <input type="text" name="telefone" placeholder="WhatsApp" required>
        <input type="date" name="data" required>
        <input type="time" name="hora" required>
        <textarea name="dor" placeholder="O que te incomoda hoje?"></textarea>

        <button type="submit">Agendar agora</button>
    </form>
</div>

</body>
</html>
